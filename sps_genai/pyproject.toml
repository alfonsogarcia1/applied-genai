[project]
name = "sps-genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alfonso Garcia", email = "317047014+alfonsogarcia1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-lg",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pillow>=11.0",
    "pydantic>=2.13.5",
    "spacy>=3.8.16",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain-core>=1.6.3",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "openai>=3.14.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[project.scripts]
sps-genai = "sps_genai:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.uv.sources]
# Docker runs Linux: use the CPU-only PyTorch build there so the image skips the CUDA libraries
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
